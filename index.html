<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Shift Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --text:#111827; --muted:#667085; --line:#e4e7ec;
  --accent:#2457d6; --accent-text:#ffffff; --chip:#eef1f6;
  --good:#12703a; --good-bg:#dcf5e5; --bad:#b42318; --bad-bg:#fde4e1; --warn:#9a5b00; --warn-bg:#fff0d6;
  --r:14px; --goal-h:88px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b0f17; --surface:#151b27; --text:#e8ecf3; --muted:#97a3b8; --line:#263044;
    --accent:#6b97ff; --accent-text:#0b0f17; --chip:#1e2636;
    --good:#4ade80; --good-bg:#12361f; --bad:#f87171; --bad-bg:#3f1a1a; --warn:#fbbf24; --warn-bg:#3a2a08;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:560px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top))}
.top .ttl{min-width:0;display:flex;flex-direction:column}
.top .ttl b{font-size:16px}
.top .ttl span{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hs{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.hs small{font-size:12px;color:var(--muted);font-weight:500;margin:0 6px}
main{max-width:560px;margin:auto;padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
body[data-tab=game] main{padding-bottom:calc(var(--goal-h) + 24px + env(safe-area-inset-bottom))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.muted{color:var(--muted);font-size:14px}
.clhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.clhead b{font-size:17px}
.pill{border-radius:999px;padding:3px 10px;font-size:13px;background:var(--chip);color:var(--muted)}
.pill.warn{background:var(--warn-bg);color:var(--warn);font-weight:600}
.clrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.clock{border:0;background:transparent;padding:0;font-size:56px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;text-align:left}
.clock:disabled{opacity:1}
.primary{min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-text);font-weight:600}
.primary.big{min-height:60px;min-width:128px;font-size:18px}
.ghost{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:transparent}
.wide{width:100%}
.blocks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.blk{min-height:84px;border-radius:12px;border:2px solid var(--line);background:var(--chip);padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px}
.blk b{font-size:16px}
.blk small{color:var(--muted);font-size:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.blk.sel{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 2px var(--accent) inset}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{min-height:44px;padding:4px 14px;border-radius:999px;border:1px solid var(--line);background:var(--chip);display:inline-flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.15}
.chip small{font-size:11px;color:var(--muted)}
.chip.on{border-color:var(--good);background:var(--good-bg)}
.chip.off{opacity:.6;border-style:dashed}
.chip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.chip.sel small{color:inherit}
span.chip{cursor:default}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.lab{font-size:13px;color:var(--muted);margin:14px 0 6px}
.pen{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:14px}
.pen b{font-variant-numeric:tabular-nums}
.ev{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 0;min-height:52px}
.ev:first-of-type{border-top:0}
.ev small{display:block;color:var(--muted);font-size:13px}
.badge{min-width:38px;text-align:center;border-radius:8px;padding:4px 6px;font-weight:700;font-size:13px}
.badge.GF{background:var(--good-bg);color:var(--good)}.badge.GA{background:var(--bad-bg);color:var(--bad)}
.after{font-variant-numeric:tabular-nums;color:var(--muted)}
.goalbar{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom);z-index:6;background:var(--bg);
  border-top:1px solid var(--line);padding:10px 12px}
.goalbar .in{max-width:560px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal{min-height:66px;border-radius:14px;border:2px solid;font-weight:700;font-size:17px}
.goal.gf{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.goal.ga{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.tabs{display:flex;border-top:1px solid var(--line)}
.tabs button{flex:1;min-height:40px;border:0;background:transparent;color:var(--muted);font-weight:600}
.tabs button.sel{color:var(--accent)}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--muted);font-weight:600;font-size:12px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.pos{color:var(--good);font-weight:600}.neg{color:var(--bad);font-weight:600}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row input[type=text],.row select,.field{flex:1;min-width:0;min-height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.row select{flex:0 0 auto;max-width:120px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{min-width:28px;text-align:center;font-size:18px}
.stepper button{width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--chip);font-size:20px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.danger{color:var(--bad);border-color:var(--bad)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:auto}
.sheet h3{margin:0 0 2px;font-size:18px}
.sheet .field{width:100%;display:block}
.sheet details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.sheet summary{cursor:pointer;color:var(--muted);min-height:36px;display:flex;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .chips{margin-top:0}
@media(min-width:900px){
  .top .in,main,.goalbar .in{max-width:1120px}
  body[data-tab=game] main{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}
  body[data-tab=game] main section:nth-child(odd){grid-column:1}
  body[data-tab=game] main section:nth-child(even){grid-column:2}
  body[data-tab=stats] main{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}
  body[data-tab=stats] main section:nth-child(1){grid-column:1/-1}
  body[data-tab=stats] main section:nth-child(2){grid-column:1}
  body[data-tab=stats] main section:nth-child(3){grid-column:2}
  body[data-tab=stats] main section:nth-child(4){grid-column:1}
  body[data-tab=stats] main section:nth-child(5){grid-column:2}
  body[data-tab=stats] main section:nth-child(6){grid-column:1}
  body[data-tab=stats] main>.muted:last-child{grid-column:1/-1}
  body[data-tab=setup] main{display:flex;flex-wrap:wrap;gap:16px;align-items:start}
  body[data-tab=setup] main>div{flex:1;min-width:0}
  body[data-tab=setup] main>section{flex:0 0 100%}
}
</style>
</head>
<body data-tab="game">
<header class="top"><div class="in">
  <div class="ttl"><b>Shift Tracker</b><span id="gamelabel"></span></div>
  <div class="hs" id="hscore" aria-label="Ergebnis"></div>
</div>
<nav class="tabs" id="tabs" aria-label="Bereiche">
  <button data-a="tab" data-id="game">Spiel</button>
  <button data-a="tab" data-id="stats">Statistik</button>
  <button data-a="tab" data-id="setup">Einstellungen</button>
</nav></header>
<main id="view"></main>
<div id="goalbar"></div>
<div id="sheet"></div>
<input type="file" id="file" accept="application/json,.json" hidden data-c="impfile">

<script>
'use strict';
/* =====================================================================
   DATA MODEL (keep this shape when porting to React/Angular)
   S = {
     v: 3,
     settings: { halfMin: 20 },
     roster: { onFloor: 3,
       goalies: [{id,name,active}],
       blocks:  [{id:'b1', name, players:[{id,name,active}]}] },
     game: {
       id, opponent, created,
       phase: 'pre' | 'h1' | 'break' | 'h2' | 'end',
       clock: { sec, run, last, label },      // game clock of the current half, counts up to halfMin
       stops: [{id, half, sec, label, ts}],   // every pause (label = Timeout us / Referee / ...)
       pens:  [{id, kind:'PP'|'BP', dur, half, sec, player}],
       live:  { block, resting:{[blockId]:[playerId]}, goalie,
                pen: null | {kind:'PP'|'BP', dur, left, player} },   // situation = pen ? pen.kind : 'EV'
       toi:   { b:{[blockId]:{EV,PP,BP}}, p:{[playerId]:{...}}, g:{[goalieId]:{...}} },   // seconds of running clock
       events:[{ id, type:'GF'|'GA', half, sec, block, floor:[playerId], goalie, state,
                 seq:'PP'|'BP'|'FO'|'TO'|'FH'|'OT'|null, scorer, assist:(playerId|'none'|null), penBefore? }]
     },
     ui: { tab, sfilter }
   }
   Time on ice only runs while the game clock runs. A penalty countdown only runs with the clock too.
   settle() must run before every line-up / goalie / situation / phase / pause change.
   ===================================================================== */
const KEY='shifttracker.v3';
const STATES={EV:'Gleichstand',PP:'Überzahl',BP:'Unterzahl'};
const SEQ={PP:'PP',BP:'BP',FO:'Bully',TO:'Ballgewinn',FH:'Freischlag',OT:'Sonstiges'};
const PAUSE_LABELS={tou:'Auszeit wir',tot:'Auszeit sie',ref:'Schiedsrichter',inj:'Verletzung',oth:'Sonstiges'};
const mem={};
const store={
  get(){try{return localStorage.getItem(KEY)}catch(e){return mem.v||null}},
  set(v){try{localStorage.setItem(KEY,v)}catch(e){mem.v=v}}
};
const uid=()=>Math.random().toString(36).slice(2,9);
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtc=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const sg=n=>n>0?'+'+n:String(n);

function defaultState(){
  const p=n=>({id:uid(),name:n,active:true});
  const roster={onFloor:3,
    goalies:[p('Flo Berger'),p('Kevin Mandlehr')],
    blocks:[
      {id:'b1',name:'Block 1',players:['Rodrigo Branco','Patrick Fischer','Darius Hampe Kurt','Lukas Schenker'].map(p)},
      {id:'b2',name:'Block 2',players:['Rafael Contessi','Timo Kühnis','Roman Schäfer'].map(p)},
      {id:'b3',name:'Block 3',players:['Yves Maillard','Adrian Berger','Lorenz Huber','Pascal Rennhard'].map(p)}
    ]};
  return {v:3,settings:{halfMin:20},roster,game:newGame(roster,''),ui:{tab:'game',sfilter:'ALL'}};
}
function newGame(roster,opp){
  const gk=roster.goalies.find(x=>x.active);
  return {id:uid(),opponent:opp||'',created:new Date().toISOString(),phase:'pre',
    clock:{sec:0,run:false,last:0,label:''},stops:[],pens:[],
    live:{block:roster.blocks[0].id,resting:{},goalie:gk?gk.id:null,pen:null},
    toi:{b:{},p:{},g:{}},events:[]};
}
function load(){
  try{const raw=store.get(); if(raw){const s=JSON.parse(raw); if(s&&s.v===3&&s.roster&&s.game) return s;}}catch(e){}
  return defaultState();
}
let S=load();
let sheet=null, tickN=0;
function save(){store.set(JSON.stringify(S))}

/* ---------- roster helpers ---------- */
const R=()=>S.roster;
const activePlayers=b=>b.players.filter(p=>p.active);
const allActive=()=>R().blocks.flatMap(activePlayers);
const blockName=id=>(R().blocks.find(b=>b.id===id)||{name:'?'}).name;
function findPlayer(id){
  for(const b of R().blocks){const p=b.players.find(x=>x.id===id); if(p) return {p,b};}
  const gk=R().goalies.find(x=>x.id===id); return gk?{p:gk,b:null}:null;
}
const nameOf=id=>{const f=findPlayer(id);return f?f.p.name:'?'};
const short=n=>{const t=String(n).trim().split(/\s+/);return t.length>1?t[0]+' '+t[t.length-1][0]+'.':n};
const first=n=>String(n).trim().split(/\s+/)[0];

/* ---------- who is resting (blocks with more players than on the floor) ---------- */
function restingOf(g,bid){
  const b=R().blocks.find(x=>x.id===bid), act=activePlayers(b);
  const need=Math.max(0,act.length-R().onFloor);
  let r=(g.live.resting[bid]||[]).filter(id=>act.some(p=>p.id===id));
  r=need?r.slice(-need):[];
  for(const p of [...act].reverse()){ if(r.length>=need) break; if(!r.includes(p.id)) r.push(p.id); }
  g.live.resting[bid]=r; return r;
}
function floorOf(g,bid){
  const b=R().blocks.find(x=>x.id===bid), rest=restingOf(g,bid);
  return activePlayers(b).filter(p=>!rest.includes(p.id));
}
function swapOut(g,bid,pid){           // pid goes off, the longest-resting player comes back on
  const r=restingOf(g,bid); if(!r.length||r.includes(pid)) return;
  r.push(pid); r.shift(); g.live.resting[bid]=r;
}

/* ---------- game clock, phases, time on ice ---------- */
const len=()=>S.settings.halfMin*60;
const inHalf=g=>g.phase==='h1'||g.phase==='h2';
const currentHalf=g=>(g.phase==='h2'||g.phase==='end')?2:1;
const sit=g=>g.live.pen?g.live.pen.kind:'EV';
function bump(o,k,st,dt){(o[k]??={EV:0,PP:0,BP:0})[st]+=dt}
function book(g,st,dt){
  const L=g.live; bump(g.toi.b,L.block,st,dt);
  floorOf(g,L.block).forEach(p=>bump(g.toi.p,p.id,st,dt));
  if(L.goalie) bump(g.toi.g,L.goalie,st,dt);
}
function addToi(g,dt){
  const L=g.live; let rem=dt;
  if(L.pen){                           // the running penalty uses up clock time first
    const used=Math.min(rem,L.pen.left);
    book(g,L.pen.kind,used); L.pen.left-=used; rem-=used;
    if(L.pen.left<=0.001) L.pen=null;
  }
  if(rem>0) book(g,'EV',rem);
}
function settle(g){                    // book the time since the last change to the current set-up
  const C=g.clock; if(!C.run) return;
  const now=Date.now(); let dt=(now-C.last)/1000; C.last=now;
  if(C.sec+dt>=len()){dt=Math.max(0,len()-C.sec); C.sec=len(); C.run=false; C.label='Zeit abgelaufen';}
  else C.sec+=dt;
  if(dt>0) addToi(g,dt);
}
function phaseAction(n){
  const g=S.game, C=g.clock; settle(g);
  if(n==='start'){g.phase='h1';C.sec=0;C.run=true;C.last=Date.now();C.label='';}
  else if(n==='endh1'){g.phase='break';C.run=false;C.sec=0;C.label='';}
  else if(n==='starth2'){g.phase='h2';C.sec=0;C.run=true;C.last=Date.now();C.label='';}
  else if(n==='endgame'){g.phase='end';C.run=false;C.label='';}
  else if(n==='reopen'){g.phase='h2';C.run=false;C.label='';}
  save();render();
}
const score=g=>g.events.reduce((a,e)=>(e.type==='GF'?a.gf++:a.ga++,a),{gf:0,ga:0});

/* ---------- actions ---------- */
function goal(type){
  const g=S.game; settle(g); const L=g.live, C=g.clock;
  const e={id:uid(),type,half:currentHalf(g),sec:Math.round(C.sec),block:L.block,
    floor:floorOf(g,L.block).map(p=>p.id),goalie:L.goalie,state:sit(g),seq:null,scorer:null,assist:null};
  // a 2-minute penalty ends when the team without the penalty scores
  if(L.pen&&L.pen.dur===120&&((L.pen.kind==='PP'&&type==='GF')||(L.pen.kind==='BP'&&type==='GA'))){
    e.penBefore={...L.pen}; L.pen=null;
  }
  g.events.push(e); sheet={type:'event',id:e.id,fresh:true}; save(); render();
  try{navigator.vibrate&&navigator.vibrate(25)}catch(_){}
}
function removeEvent(id){
  const g=S.game, e=g.events.find(x=>x.id===id); if(!e) return;
  if(e.penBefore&&!g.live.pen) g.live.pen=e.penBefore;   // undo also restores the penalty it ended
  g.events=g.events.filter(x=>x.id!==id);
}
function act(a,d){
  const g=S.game, C=g.clock, L=g.live;
  switch(a){
    case 'tab': S.ui.tab=d.id; sheet=null; break;
    case 'block': settle(g); L.block=d.id; break;
    case 'swap': settle(g); swapOut(g,L.block,d.id); break;
    case 'goalie': settle(g); L.goalie=d.id; break;
    case 'phase': phaseAction(d.n); return;
    case 'goal': goal(d.t); return;
    case 'pause': settle(g); if(C.run){C.run=false;C.label='';g.stops.push({id:uid(),half:currentHalf(g),sec:Math.round(C.sec),label:'',ts:Date.now()});} break;
    case 'resume': if(inHalf(g)&&!C.run&&C.sec<len()){C.run=true;C.last=Date.now();C.label='';} break;
    case 'plabel': { C.label=PAUSE_LABELS[d.id]; const s=g.stops[g.stops.length-1]; if(s) s.label=C.label; break; }
    case 'clockedit': if(inHalf(g)) sheet={type:'clock'}; break;
    case 'clockset': { const m=/^(\d{1,2}):([0-5]\d)$/.exec(($('#clkin').value||'').trim());
      if(m){ settle(g); C.sec=Math.min(len(),+m[1]*60+ +m[2]); if(C.sec>=len()){C.run=false;C.label='Time up';} sheet=null; } break; }
    case 'pensheet': settle(g); sheet={type:'pen',kind:d.k,dur:120,player:null}; break;
    case 'pendur': sheet.dur=+d.v; break;
    case 'penplayer': sheet.player=sheet.player===d.id?null:d.id; break;
    case 'penstart': settle(g);
      L.pen={kind:sheet.kind,dur:sheet.dur,left:sheet.dur,player:sheet.player};
      g.pens.push({id:uid(),kind:sheet.kind,dur:sheet.dur,half:currentHalf(g),sec:Math.round(C.sec),player:sheet.player});
      sheet=null; break;
    case 'penend': settle(g); L.pen=null; break;
    case 'evscorer': { const e=g.events.find(x=>x.id===sheet.id); if(!e) break;
      e.scorer=e.scorer===d.id?null:d.id; if(e.assist===d.id) e.assist=null; break; }
    case 'evassist': { const e=g.events.find(x=>x.id===sheet.id); if(!e) break;
      if(d.id===e.scorer) break; e.assist=e.assist===d.id?null:d.id; break; }
    case 'evseq': { const e=g.events.find(x=>x.id===sheet.id); if(!e) break; e.seq=e.seq===d.id?null:d.id; break; }
    case 'evedit': sheet={type:'event',id:d.id}; break;
    case 'evfloor': { const e=g.events.find(x=>x.id===sheet.id); if(!e) break;
      e.floor=e.floor.includes(d.id)?e.floor.filter(x=>x!==d.id):[...e.floor,d.id];
      if(!e.floor.includes(e.scorer)) e.scorer=null; if(!e.floor.includes(e.assist)&&e.assist!=='none') e.assist=null; break; }
    case 'evdel': if(sheet.fresh||confirm('Dieses Tor löschen?')){removeEvent(sheet.id); sheet=null;} break;
    case 'closesheet': sheet=null; break;
    case 'showall': S.ui.showAll=!S.ui.showAll; break;
    case 'sfilter': S.ui.sfilter=d.id; break;
    case 'step': { const dl=+d.d;
      if(d.k==='halfMin'){ settle(g); S.settings.halfMin=Math.min(45,Math.max(5,S.settings.halfMin+dl)); }
      if(d.k==='onFloor'){ settle(g); R().onFloor=Math.min(6,Math.max(1,R().onFloor+dl)); }
      break; }
    case 'addplayer': R().blocks.find(x=>x.id===d.id).players.push({id:uid(),name:'Neuer Spieler',active:true}); break;
    case 'addgoalie': R().goalies.push({id:uid(),name:'Neuer Torhüter',active:true}); break;
    case 'rm': if(confirm(nameOf(d.id)+' entfernen? Vergangene Tore behalten den Namen.')){
        settle(g); const f=findPlayer(d.id); if(f) f.p.active=false;
        if(L.goalie===d.id){const n=R().goalies.find(x=>x.active); L.goalie=n?n.id:null;} }
      break;
    case 'newgame': if(confirm('Neues Spiel starten? Tore, Uhr und Zeiten werden gelöscht (vorher exportieren falls nötig). Der Kader bleibt.')){
        S.game=newGame(R(),S.game.opponent); S.ui.tab='game'; sheet=null; } break;
    case 'demo': if(confirm('Aktuelles Spiel durch Demodaten ersetzen?')){S.game=demoGame(); S.ui.tab='stats';} break;
    case 'expjson': download('shift-tracker-backup.json',JSON.stringify(S,null,2),'application/json'); return;
    case 'expcsv': download(`shift-stats-${(S.game.opponent||'game').replace(/[^a-z0-9]/gi,'-')}-${S.game.created.slice(0,10)}.csv`,toCsv(),'text/csv'); return;
    case 'expevents': download(`shift-verlauf-${(S.game.opponent||'spiel').replace(/[^a-z0-9]/gi,'-')}-${S.game.created.slice(0,10)}.csv`,toEventsCsv(),'text/csv'); return;
    case 'impjson': $('#file').click(); return;
    case 'reset': if(confirm('Alle Daten einschließlich des Kaders löschen und Standardwerte wiederherstellen?')){S=defaultState(); sheet=null;} break;
  }
  save(); render();
}
function chg(c,v,d,el){
  const g=S.game;
  if(c==='pname'){const f=findPlayer(d.id); if(f&&v.trim()) f.p.name=v.trim(); save(); return;}
  if(c==='bname'){const b=R().blocks.find(x=>x.id===d.id); if(b&&v.trim()) b.name=v.trim(); save(); return;}
  if(c==='opp'){g.opponent=v.trim(); save(); $('#gamelabel').textContent=gameLabel(); return;}
  if(c==='pblock'){const f=findPlayer(d.id); if(!f||!f.b) return; settle(g);
    f.b.players=f.b.players.filter(x=>x.id!==d.id); R().blocks.find(b=>b.id===v).players.push(f.p); save(); render(); return;}
  if(c==='impfile'){const file=el.files[0]; el.value=''; if(!file) return;
    file.text().then(t=>{try{const s=JSON.parse(t);
      if(!(s&&s.v===3&&s.roster&&s.game)) throw 0;
      if(confirm('Alle aktuellen Daten mit dieser Sicherung ersetzen?')){S=s;sheet=null;save();render();}
    }catch(e){alert('Das ist keine gültige Sicherungsdatei.')}}); return;}
  if(c.startsWith('ev.')){
    const e=g.events.find(x=>x.id===sheet.id); if(!e) return; const k=c.slice(3);
    if(k==='type'){e.type=v; if(v==='GA'){e.scorer=null;e.assist=null;}}
    else if(k==='block'){settle(g); e.block=v; e.floor=floorOf(g,v).map(p=>p.id); e.scorer=null; e.assist=null;}
    else if(k==='state') e.state=v;
    else if(k==='goalie') e.goalie=v||null;
    else if(k==='half') e.half=+v;
    else if(k==='time'){const m=/^(\d{1,2}):([0-5]\d)$/.exec(v.trim()); if(m) e.sec=+m[1]*60+ +m[2];}
    save(); render();
  }
}

/* ---------- stats ---------- */
function compute(g,filter){
  const states=filter==='ALL'?['EV','PP','BP']:[filter];
  const B={},P={},G={},Q={};
  const get=(o,k)=>(o[k]??={gf:0,ga:0,toi:0,g:0,a:0});
  const sum=v=>states.reduce((a,s)=>a+(v[s]||0),0);
  for(const [k,v] of Object.entries(g.toi.b)) get(B,k).toi+=sum(v);
  for(const [k,v] of Object.entries(g.toi.p)) get(P,k).toi+=sum(v);
  for(const [k,v] of Object.entries(g.toi.g)) get(G,k).toi+=sum(v);
  for(const e of g.events){
    if(!states.includes(e.state)) continue;
    const gf=e.type==='GF';
    gf?get(B,e.block).gf++:get(B,e.block).ga++;
    e.floor.forEach(id=>{gf?get(P,id).gf++:get(P,id).ga++});
    if(e.goalie) gf?get(G,e.goalie).gf++:get(G,e.goalie).ga++;
    gf?get(Q,e.seq||'?').gf++:get(Q,e.seq||'?').ga++;
    if(gf){ if(e.scorer) get(P,e.scorer).g++; if(e.assist&&e.assist!=='none') get(P,e.assist).a++; }
  }
  const pen={}; // penalties are not filtered by situation
  for(const x of g.pens){ if(!x.player) continue; const o=(pen[x.player]??={taken:0,pim:0,drawn:0});
    if(x.kind==='BP'){o.taken++;o.pim+=x.dur/60;} else o.drawn++; }
  return {B,P,G,Q,pen};
}

function viewStats(){
  const g=S.game, f=S.ui.sfilter||'ALL';
  const {B,P,G,Q,pen}=compute(g,f);
  const per20=(v,t)=>t>=60?(v/t*1200).toFixed(1):'–';
  const pm=n=>`<span class="${n>0?'pos':n<0?'neg':''}">${sg(n)}</span>`;
  const sc=score(g);
  const blockRows=R().blocks.map(b=>{const s=B[b.id]||{gf:0,ga:0,toi:0};
    return `<tr><td>${esc(b.name)}</td><td>${s.gf}</td><td>${s.ga}</td><td>${pm(s.gf-s.ga)}</td><td>${fmt(s.toi)}</td><td>${per20(s.gf-s.ga,s.toi)}</td></tr>`}).join('');
  const playerRows=R().blocks.flatMap(b=>b.players.filter(p=>p.active||P[p.id]).map(p=>{
    const s=P[p.id]||{gf:0,ga:0,toi:0,g:0,a:0};

  const goalieRows=R().goalies.filter(p=>p.active||G[p.id]).map(p=>{const s=G[p.id]||{ga:0,toi:0};
    return `<tr><td>${esc(short(p.name))}</td><td>${s.ga}</td><td>${fmt(s.toi)}</td><td>${per20(s.ga,s.toi)}</td></tr>`}).join('');
  const seqRows=[...Object.keys(SEQ),'?'].filter(k=>Q[k]).map(k=>`<tr><td>${k==='?'?'Nicht gesetzt':SEQ[k]}</td><td>${Q[k].gf}</td><td>${Q[k].ga}</td></tr>`).join('');
  const penRows=Object.entries(pen).map(([id,s])=>`<tr><td>${esc(short(nameOf(id)))}</td><td>${s.taken}</td><td>${s.pim}</td><td>${s.drawn}</td></tr>`).join('');
  const nPP=g.pens.filter(x=>x.kind==='PP').length, nBP=g.pens.filter(x=>x.kind==='BP').length;
  return `
  <section class="card">
    <h2>Nach Situation filtern</h2>
    <div class="seg">${[['ALL','Alle'],['EV','Gleichstand'],['PP','Überzahl'],['BP','Unterzahl']].map(([id,l])=>
      `<button class="chip ${f===id?'sel':''}" data-a="sfilter" data-id="${id}">${l}</button>`).join('')}</div>
    <div class="muted" style="margin-top:10px">Ergebnis ${sc.gf}–${sc.ga} · ${g.events.length} Tore · ${nPP} Überzahlen · ${nBP} Unterzahlen</div>
  </section>
  <section class="card"><h2>Blöcke</h2><div class="scroll"><table class="tbl">
    <tr><th>Block</th><th>GF</th><th>GA</th><th>+/−</th><th>TOI</th><th>+/− pro 20</th></tr>${blockRows}</table></div></section>
  <section class="card"><h2>Spieler</h2><div class="scroll"><table class="tbl">
    <tr><th>Spieler</th><th>Blk</th><th>+/−</th><th>GF</th><th>GA</th><th>TOI</th><th>T</th><th>A</th></tr>${playerRows}</table></div>

    <tr><th>Spieler</th><th>Erhalten (UZ)</th><th>Strafmin.</th><th>Gezogen (ÜZ)</th></tr>${penRows}</table></div></section>`:''}

    <div class="chips">${allActive().map(p=>`<button class="chip ${sheet.player===p.id?'sel':''}" data-a="penplayer" data-id="${p.id}">${esc(short(p.name))}</button>`).join('')}</div>
    <div class="btns" style="margin-top:16px"><button class="primary" data-a="penstart">${pp?'Überzahl starten':'Unterzahl starten'}</button><button class="ghost" data-a="closesheet">Abbrechen</button></div>
  </div>`;
}
function sheetClock(){
  return `<div class="scrim" data-a="closesheet"></div><div class="sheet" role="dialog" aria-label="Uhr korrigieren">
    <h3>Uhr korrigieren</h3><div class="muted">Auf die in der Halle angezeigte Zeit setzen (m:ss).</div>
    <input class="field" id="clkin" type="text" inputmode="numeric" value="${fmt(S.game.clock.sec)}" style="margin-top:12px">
    <div class="btns" style="margin-top:16px"><button class="primary" data-a="clockset">Setzen</button><button class="ghost" data-a="closesheet">Abbrechen</button></div>
  </div>`;
}
function sheetHtml(){return sheet.type==='event'?sheetEvent():sheet.type==='pen'?sheetPen():sheetClock();}

function render(){
  const tab=S.ui.tab, sc=score(S.game);
  document.body.dataset.tab=tab;
  $('#view').innerHTML=tab==='game'?viewGame():tab==='stats'?viewStats():viewSetup();
  $('#goalbar').innerHTML=tab==='game'?`<div class="goalbar"><div class="in">
    <button class="goal gf" data-a="goal" data-t="GF">TOR</button>
    <button class="goal ga" data-a="goal" data-t="GA">GEGENTOR</button></div></div>`:'';
  document.querySelectorAll('#tabs button').forEach(b=>{b.classList.toggle('sel',b.dataset.id===tab); b.setAttribute('aria-current',b.dataset.id===tab?'page':'false')});
  $('#sheet').innerHTML=sheet?sheetHtml():'';
  $('#gamelabel').textContent=gameLabel();
  $('#hscore').innerHTML=`${sc.gf}<small>:</small>${sc.ga}`;
}

/* ---------- export / demo ---------- */
function download(name,text,type){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function toCsv(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const head=['name','block','toi_ev','toi_pp','toi_bp','toi_total','gf_on_ice','ga_on_ice','goals_scored','assists'];
  const rows=[];
  for(const blk of S.roster.blocks){
    for(const p of blk.players){
      const t=S.game.toi.p[p.id]??{EV:0,PP:0,BP:0};
      const tot=t.EV+t.PP+t.BP;
      const gf=S.game.events.filter(e=>e.type==='GF'&&e.floor.includes(p.id)).length;
      const ga=S.game.events.filter(e=>e.type==='GA'&&e.floor.includes(p.id)).length;
      const goals=S.game.events.filter(e=>e.type==='GF'&&e.scorer===p.id).length;
      const ast=S.game.events.filter(e=>e.type==='GF'&&e.assist===p.id).length;
      rows.push([p.name,blk.name,fmt(t.EV),fmt(t.PP),fmt(t.BP),fmt(tot),gf,ga,goals,ast].map(q).join(','));
    }
  }
  for(const g of S.roster.goalies){
    const t=S.game.toi.g[g.id]??{EV:0,PP:0,BP:0};
    const tot=t.EV+t.PP+t.BP;
    const ga=S.game.events.filter(e=>e.type==='GA'&&e.goalie===g.id).length;
    rows.push([g.name,'Goalie',fmt(t.EV),fmt(t.PP),fmt(t.BP),fmt(tot),'',ga,'',''].map(q).join(','));
  }
  return [head.map(q).join(','),...rows].join('\n');
}
function toEventsCsv(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const head=['halbzeit','zeit','typ','block','situation','spielszene','torhueter','auf_dem_feld','torschuetze','assist'];
  const rows=S.game.events.slice().sort((a,b)=>a.half-b.half||a.sec-b.sec).map(e=>[
    e.half,fmt(e.sec),e.type,blockName(e.block),STATES[e.state],e.seq?SEQ[e.seq]:'',
    e.goalie?nameOf(e.goalie):'',e.floor.map(nameOf).join('; '),
    e.scorer?nameOf(e.scorer):'',e.assist&&e.assist!=='none'?nameOf(e.assist):''
  ].map(q).join(','));
  return [head.map(q).join(','),...rows].join('\n');
}
function demoGame(){
  const g=newGame(R(),'Demo opponent'); g.phase='end'; g.clock.sec=len(); const gk=R().goalies.filter(p=>p.active);
  R().blocks.forEach((b,i)=>{g.live.block=b.id; const secs={EV:560-i*40,PP:60+i*10,BP:40+i*10};
    for(const st of ['EV','PP','BP']) book(g,st,secs[st]);});
  g.live.block=R().blocks[0].id;
  const pick=a=>a[Math.floor(Math.random()*a.length)], seqs=Object.keys(SEQ);
  const ev=[];
  for(let i=0;i<12;i++){const b=pick(R().blocks), fl=floorOf(g,b.id).map(p=>p.id), r=Math.random(), gf=Math.random()<0.5;
    ev.push({id:uid(),type:gf?'GF':'GA',half:i<6?1:2,sec:60+Math.floor(Math.random()*1100),block:b.id,floor:fl,goalie:gk[0]?gk[0].id:null,
      state:r<0.7?'EV':r<0.85?'PP':'BP',seq:pick(seqs),scorer:gf?pick(fl):null,assist:gf?(Math.random()<0.6?pick(fl):'none'):null});}
  ev.forEach(e=>{if(e.assist===e.scorer) e.assist='none';});
  ev.sort((a,b)=>a.half-b.half||a.sec-b.sec); g.events=ev;
  const ap=allActive(); g.pens=[{id:uid(),kind:'PP',dur:120,half:1,sec:300,player:pick(ap).id},{id:uid(),kind:'BP',dur:120,half:2,sec:700,player:pick(ap).id}];
  return g;
}

/* ---------- wiring ---------- */
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]'); if(el&&!el.disabled) act(el.dataset.a,el.dataset);});
document.addEventListener('change',ev=>{const el=ev.target.closest('[data-c]'); if(el) chg(el.dataset.c,el.value,el.dataset,el);});
setInterval(()=>{
  const g=S.game, C=g.clock; if(!C.run) return;
  const sig=()=>(C.run?1:0)+'|'+(g.live.pen?1:0);
  const before=sig(); settle(g); tickN++;
  if(sig()!==before){ save(); render(); return; }       // time up or penalty over
  const el=$('#clock'); if(el) el.textContent=fmtc(C.sec);
  const pe=$('#pen'); if(pe&&g.live.pen) pe.textContent=fmtc(g.live.pen.left);
  if(tickN%20===0) save();
  if(tickN%40===0){ const a=document.activeElement;
    if(S.ui.tab==='stats'&&!sheet&&!(a&&/INPUT|SELECT/.test(a.tagName))) render(); }
},250);
const flush=()=>{settle(S.game);save()};
document.addEventListener('visibilitychange',()=>{ if(document.hidden) flush(); else {settle(S.game); render();} });
window.addEventListener('pagehide',flush);
render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
